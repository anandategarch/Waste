name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lint — error fatal saja (E9 = syntax error, F63/F7/F82 = bug nyata)
        run: |
          pip install ruff
          ruff check . --select E9,F63,F7,F82
        continue-on-error: false

      - name: Test suite (150 test — golden regression + unit)
        run: python -m pytest tests/ -v --tb=short
        env:
          MPLBACKEND: Agg

      - name: Smoke — import paket ui tanpa display
        run: python -c "from ui.app import WasteAnomalyApp; from waste_anomaly import __version__; print('OK', __version__)"

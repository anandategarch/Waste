name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: System libs Qt (Linux — PySide6 butuh libEGL/libGL utk offscreen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Lint — error fatal saja (E9 = syntax error, F63/F7/F82 = bug nyata)
        run: |
          pip install ruff
          ruff check . --select E9,F63,F7,F82
        continue-on-error: false

      - name: Test suite (431 test — golden regression + unit + analisa v2.5.0 + semantik filter v2.5.1 + struktur UI PySide6 v2.6.0 + fix audit v2.7.0 + penyederhanaan v2.8.0 + pop-up detail & kolom % to BOM & 3 view v2.8.1 + hotfix SETUP.bat v2.8.2)
        run: python -m pytest tests/ -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Smoke — import paket ui + versi
        run: python -c "from ui.app import MainWindow, main; from waste_anomaly import __version__; print('OK', __version__)"
        env:
          QT_QPA_PLATFORM: offscreen
